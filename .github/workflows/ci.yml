name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    env:
      # Placeholders only. database.py creates an engine at import and makes no connection.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes pytest

      - name: Lint (pyflakes, blocking)
        run: python -m pyflakes $(git ls-files '*.py' | grep -v '^migrations/')

      - name: Test
        run: python -m pytest tests -q
